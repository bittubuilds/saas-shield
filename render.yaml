# Render Blueprint - one-click free deploy for SaaS Shield
# Sign up at render.com with GitHub, then New -> Blueprint -> select this repo.
services:
  - type: web
    name: saas-shield
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false   # set to your Render URL after first deploy (https://saas-shield.onrender.com)
      - key: SHIELD_ALLOW_PRIVATE_IPS
        value: "false"
      - key: SERPER_API_KEY
        sync: false   # free key from serper.dev - needed only for auto-discovery
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: "SaaS Shield <onboarding@resend.dev>"   # switch to a verified domain sender when you have one
      - key: RESEND_API_KEY
        sync: false   # paste the Resend API key in the Render dashboard (never commit it)
      - key: CRON_SECRET
        sync: false   # long random string; the external cron job must send the same value
